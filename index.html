<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BTX • Prontuário + Agenda (HTML)</title>

  <!-- jsPDF (PDF confiável, sem print) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- html2canvas para capturar telas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root{
      --bg:#0b1220;
      --panel:#101c33;
      --card:#122544;
      --line:#223a67;
      --text:#e8efff;
      --muted:#9fb3da;
      --accent:#1a6dcc;
      --accent2:#0d4d9c;
      --danger:#dc3545;
      --warning:#eab308;
      --ok:#22c55e;
      --purple:#8b5cf6;
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: "Segoe UI", system-ui, -apple-system, Arial;
      color:var(--text);
      background:
        radial-gradient(1000px 600px at 15% 0%, rgba(26,109,204,.28), transparent 60%),
        radial-gradient(900px 520px at 85% 10%, rgba(13,77,156,.32), transparent 55%),
        var(--bg);
      padding:14px;
      min-height:100vh;
    }
    header{
      display:flex; gap:12px; align-items:center; justify-content:space-between;
      padding:14px 14px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(26,109,204,.92), rgba(13,77,156,.95));
      box-shadow: 0 10px 28px rgba(0,0,0,.28);
      flex-wrap:wrap;
      backdrop-filter: blur(10px);
    }
    header .left{display:flex; gap:12px; align-items:center}
    .logo{
      width:44px;height:44px;border-radius:14px;
      background: rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.18);
      display:grid;place-items:center;
      font-size:22px;
    }
    header h1{margin:0;font-size:18px;line-height:1.1}
    header p{margin:4px 0 0;font-size:12px;opacity:.9}
    .btn{
      border:none; cursor:pointer; user-select:none;
      padding:10px 12px;
      border-radius: 12px;
      font-weight:800;
      color:white;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      box-shadow: 0 10px 18px rgba(0,0,0,.22);
      display:inline-flex; align-items:center; gap:8px;
      transition: transform .12s ease, box-shadow .2s ease;
    }
    .btn:hover{box-shadow: 0 12px 22px rgba(0,0,0,.28);}
    .btn:active{transform: translateY(1px)}
    .btn.secondary{
      background: linear-gradient(90deg, rgba(255,255,255,.14), rgba(255,255,255,.10));
      border:1px solid rgba(255,255,255,.16);
      color: var(--text);
      box-shadow:none;
    }
    .btn.danger{
      background: linear-gradient(90deg, rgba(220,53,69,.95), rgba(179,39,52,.98));
    }
    .btn.warning{
      background: linear-gradient(90deg, rgba(234,179,8,.95), rgba(202,138,4,.98));
    }
    .btn.purple{
      background: linear-gradient(90deg, rgba(139,92,246,.95), rgba(124,58,237,.98));
    }

    .grid{
      margin-top:14px;
      display:grid;
      grid-template-columns: 330px 1fr;
      gap:14px;
    }
    @media (max-width: 980px){
      .grid{grid-template-columns: 1fr}
    }

    .panel{
      background: rgba(16,28,51,.88);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      box-shadow: 0 12px 30px rgba(0,0,0,.28);
      overflow:hidden;
      backdrop-filter: blur(10px);
    }
    .tabs{
      display:flex; flex-wrap:wrap;
      background: rgba(255,255,255,.06);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .tab{
      flex:1; min-width: 140px;
      padding:12px 12px;
      background: transparent;
      border:none;
      cursor:pointer;
      color: rgba(231,238,252,.78);
      font-weight:900;
      display:flex; gap:8px; align-items:center; justify-content:center;
      transition: all .2s ease;
    }
    .tab:hover{
      background: rgba(255,255,255,.08);
    }
    .tab.active{
      color:white;
      background: linear-gradient(180deg, rgba(26,109,204,.22), rgba(13,77,156,.08));
      border-bottom: 3px solid rgba(26,109,204,.9);
    }

    .content{padding:14px}
    .title{margin:0 0 10px; font-size:14px; font-weight:1000; letter-spacing:.2px}
    .hint{margin:0 0 12px; font-size:12px; color: var(--muted)}
    .card{
      background: rgba(18,37,68,.74);
      border:1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding:12px;
      margin-bottom:12px;
    }
    .row{display:grid; grid-template-columns: 1fr 1fr; gap:10px}
    @media (max-width: 520px){ .row{grid-template-columns:1fr} }
    label{display:block; font-size:12px; font-weight:900; color: rgba(231,238,252,.86); margin:0 0 6px}
    input, select, textarea{
      width:100%;
      padding:11px 12px;
      border-radius: 12px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.22);
      color: var(--text);
      outline:none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    input:focus, select:focus, textarea:focus{
      border-color: rgba(26,109,204,.75);
      box-shadow: 0 0 0 3px rgba(26,109,204,.18);
    }
    textarea{min-height: 92px; resize: vertical}

    .list{display:flex; flex-direction:column; gap:10px}
    .item{
      background: rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      padding:10px 12px;
      transition: transform .15s ease, border-color .15s ease;
    }
    .item:hover{
      transform: translateY(-2px);
      border-color: rgba(26,109,204,.35);
    }
    .item .top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
    .pill{
      font-size:11px; font-weight:1000;
      padding:4px 8px;
      border-radius: 999px;
      background: rgba(26,109,204,.22);
      border:1px solid rgba(26,109,204,.35);
      white-space:nowrap;
    }
    .pill.urg{background: rgba(220,53,69,.16); border-color: rgba(220,53,69,.35)}
    .pill.warn{background: rgba(234,179,8,.16); border-color: rgba(234,179,8,.35)}
    .pill.ok{background: rgba(34,197,94,.16); border-color: rgba(34,197,94,.35)}
    .meta{margin-top:6px; color: rgba(231,238,252,.72); font-size:12px; line-height:1.35}
    .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; align-items:center}
    .small{font-size:11px; color: rgba(231,238,252,.70)}
    .hr{height:1px; background: rgba(255,255,255,.08); margin:12px 0}

    /* CALENDÁRIO MENSAL CLICÁVEL */
    .calWrap{display:flex; flex-direction:column; gap:10px}
    .calHead{display:flex; gap:10px; align-items:center; justify-content:space-between}
    .calGrid{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap:8px;
    }
    .dow{font-size:11px; color: rgba(231,238,252,.70); font-weight:900; text-align:center}
    .dayCell{
      min-height:78px;
      border-radius: 14px;
      padding:8px;
      background: rgba(0,0,0,.16);
      border:1px solid rgba(255,255,255,.10);
      cursor:pointer;
      transition: transform .08s ease, border-color .08s ease;
      overflow:hidden;
      position:relative;
    }
    .dayCell:hover{transform: translateY(-1px); border-color: rgba(26,109,204,.35)}
    .dayCell.muted{opacity:.45}
    .dayCell.selected{outline: 2px solid rgba(26,109,204,.65)}
    .dayNum{font-weight:1000; font-size:12px}
    .badgeApt{
      margin-top:6px;
      display:inline-block;
      font-size:10px;
      font-weight:1000;
      padding:3px 7px;
      border-radius:999px;
      background: rgba(26,109,204,.22);
      border:1px solid rgba(26,109,204,.30);
    }

    /* Preview PDF */
    .pdfBox{
      border-radius: 14px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.20);
      height: 520px;
    }
    .pdfBox iframe{width:100%; height:100%; border:0; background:white}
    
    /* Modal */
    .modal{
      position:fixed;
      top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,.85);
      backdrop-filter: blur(8px);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:1000;
      padding:20px;
    }
    .modal.show{display:flex;}
    .modal-content{
      background:var(--panel);
      border-radius:var(--radius);
      padding:20px;
      max-width:600px;
      width:100%;
      max-height:90vh;
      overflow-y:auto;
      border:1px solid rgba(255,255,255,.12);
      box-shadow: 0 20px 40px rgba(0,0,0,.5);
    }
    
    .toast{
      position: fixed;
      left: 16px; right:16px;
      bottom: 16px;
      padding:12px 14px;
      border-radius: 14px;
      background: rgba(0,0,0,.72);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(10px);
      display:none;
      box-shadow: 0 14px 30px rgba(0,0,0,.35);
      z-index: 50;
    }
    .toast.show{display:block; animation: slideUp 0.3s ease}
    .toast b{color:white}
    
    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    /* Stats */
    .stats-grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap:10px;
      margin-bottom:14px;
    }
    .stat-card{
      background:rgba(0,0,0,.22);
      border-radius:12px;
      padding:12px;
      border:1px solid rgba(255,255,255,.08);
    }
    .stat-value{
      font-size:24px;
      font-weight:1000;
      color:var(--accent);
    }
    .stat-label{
      font-size:11px;
      color:var(--muted);
    }
    
    /* Receita médica específica */
    .receita-grid{
      display:grid;
      grid-template-columns: 60px 1fr 80px 80px;
      gap:8px;
      margin:10px 0;
    }
    .receita-header{
      font-weight:900;
      font-size:11px;
      color:var(--muted);
      padding-bottom:4px;
      border-bottom:1px solid rgba(255,255,255,.1);
    }
    
    /* Loader */
    .loader{
      display:inline-block;
      width:20px;
      height:20px;
      border:2px solid rgba(255,255,255,.2);
      border-top-color:var(--accent);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{
      to{transform:rotate(360deg);}
    }
    
    /* Tabelas */
    .table{
      width:100%;
      border-collapse:collapse;
      font-size:12px;
    }
    .table th{
      text-align:left;
      padding:8px;
      background:rgba(0,0,0,.22);
      border-bottom:1px solid rgba(255,255,255,.1);
      font-weight:900;
    }
    .table td{
      padding:8px;
      border-bottom:1px solid rgba(255,255,255,.05);
    }
  </style>
</head>

<body>
<header>
  <div class="left">
    <div class="logo">🧠</div>
    <div>
      <h1>BTX • Prontuário + Agenda</h1>
      <p>HTML único • Prontuário evolutivo • Agenda clicável • PDF estável (jsPDF)</p>
    </div>
  </div>
  <div class="right" style="display:flex; gap:10px; flex-wrap:wrap">
    <button class="btn secondary" onclick="exportBackup()">⬇️ Backup</button>
    <button class="btn secondary" onclick="importBackup()">⬆️ Restaurar</button>
    <button class="btn danger" onclick="clearAll()">🗑️ Limpar</button>
  </div>
</header>

<div class="grid">
  <!-- Sidebar -->
  <div class="panel">
    <div class="tabs">
      <button class="tab active" data-tab="config">⚙️ Config</button>
      <button class="tab" data-tab="agenda">📅 Agenda</button>
      <button class="tab" data-tab="pacientes">👤 Pacientes</button>
      <button class="tab" data-tab="receitas">💊 Receitas</button>
      <button class="tab" data-tab="docs">📄 PDFs</button>
    </div>
    <div class="content" id="side"></div>
  </div>

  <!-- Main -->
  <div class="panel">
    <div class="content" id="main"></div>
  </div>
</div>

<!-- Modal para Receitas -->
<div class="modal" id="receitaModal">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <div class="title">💊 Receita Médica</div>
      <button class="btn secondary" onclick="closeModal()">✕ Fechar</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================
   BANCO (localStorage)
========================= */
const KEY = "btx_html_prontuario_v3";

function loadDB(){
  try { 
    const data = localStorage.getItem(KEY);
    if(!data) return {};
    return JSON.parse(data); 
  }
  catch(e){ 
    console.error("Erro ao carregar banco:", e);
    return {}; 
  }
}
function saveDB(db){ 
  try {
    localStorage.setItem(KEY, JSON.stringify(db));
    return true;
  } catch(e) {
    console.error("Erro ao salvar banco:", e);
    toast("Erro ao salvar dados", false);
    return false;
  }
}

function ensureDB(){
  const db = loadDB();
  db.prof = db.prof || {
    categoria:"Misto (CRM/CRO)",
    nome:"",
    registro:"",
    contato:"",
    endereco:"",
    cidadeUF:"",
    especialidade:"",
    crmCro:""
  };
  db.pacientes = db.pacientes || [];   // {id, nome, nasc, telefone, email, cpf, obs, criadoEm}
  db.evolucoes = db.evolucoes || [];   // {id, pacienteId, dataISO, tipoAtend, soapS, soapO, soapA, soapP, odonto, exames, conduta, anotacoes}
  db.agenda = db.agenda || [];         // {id, pacienteId, dataISO, hora, tipo, resumo, status, duracao}
  db.receitas = db.receitas || [];     // {id, pacienteId, dataISO, medicoId, itens[], observacoes, validade}
  db.medicamentos = db.medicamentos || [
    {nome: "Dipirona Sódica 500mg", apresentacao: "Comprimidos"},
    {nome: "Paracetamol 750mg", apresentacao: "Comprimidos"},
    {nome: "Ibuprofeno 400mg", apresentacao: "Comprimidos"},
    {nome: "Amoxicilina 500mg", apresentacao: "Cápsulas"},
    {nome: "Omeprazol 20mg", apresentacao: "Cápsulas"},
    {nome: "Losartana 50mg", apresentacao: "Comprimidos"},
    {nome: "Hidroclorotiazida 25mg", apresentacao: "Comprimidos"},
    {nome: "Sinvastatina 20mg", apresentacao: "Comprimidos"},
    {nome: "Metformina 850mg", apresentacao: "Comprimidos"},
    {nome: "Clonazepam 0,5mg", apresentacao: "Comprimidos"},
    {nome: "Sertralina 50mg", apresentacao: "Comprimidos"},
    {nome: "Diazepam 5mg", apresentacao: "Comprimidos"},
    {nome: "Prednisona 20mg", apresentacao: "Comprimidos"},
    {nome: "Cefalexina 500mg", apresentacao: "Cápsulas"},
    {nome: "Azitromicina 500mg", apresentacao: "Comprimidos"},
  ];
  saveDB(db);
  return db;
}
let db = ensureDB();

/* =========================
   ESTADO
========================= */
let activeTab = "config";
let selectedPatientId = null;
let selectedDayISO = toISODate(new Date());
let monthCursor = new Date();
let pdfURL = null;
let editingReceitaId = null;

/* =========================
   HELPERS
========================= */
function escapeHtml(text) {
  if(text == null) return "";
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function toast(msg, ok=true){
  const t = document.getElementById("toast");
  t.innerHTML = `<b>${ok ? "✅" : "⚠️"}</b> ${msg}`;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2600);
}

function uid(){ 
  return Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
}

function toISODate(d){
  const dt = new Date(d);
  const y = dt.getFullYear();
  const m = String(dt.getMonth()+1).padStart(2,'0');
  const da = String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
}

function fmtBRDate(iso){
  if(!iso) return "--/--/----";
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR");
}

function fmtBRDateTime(iso){
  if(!iso) return "--/--/---- --:--";
  const d = new Date(iso);
  return d.toLocaleString("pt-BR");
}

function byName(a,b){ return (a.nome||"").localeCompare(b.nome||""); }

function getPatient(id){ return db.pacientes.find(p=>p.id===id) || null; }

function getEvolucoes(pId){
  return db.evolucoes
    .filter(e=>e.pacienteId===pId)
    .sort((a,b)=> new Date(b.dataISO) - new Date(a.dataISO));
}

function getAgendaByDay(dayISO){
  return db.agenda
    .filter(a => toISODate(a.dataISO) === dayISO)
    .sort((a,b)=>(a.hora||"").localeCompare(b.hora||""));
}

function getReceitasByPatient(pId){
  return db.receitas
    .filter(r=>r.pacienteId===pId)
    .sort((a,b)=> new Date(b.dataISO) - new Date(a.dataISO));
}

function safe(v){ 
  if(v == null) return "";
  if(typeof v === "string") return v;
  return v.toString(); 
}

function calcularIdade(nascimento){
  if(!nascimento) return null;
  const hoje = new Date();
  const nasc = new Date(nascimento);
  let idade = hoje.getFullYear() - nasc.getFullYear();
  const mes = hoje.getMonth() - nasc.getMonth();
  if (mes < 0 || (mes === 0 && hoje.getDate() < nasc.getDate())) {
    idade--;
  }
  return idade;
}

function formatTelefone(tel){
  if(!tel) return "";
  const apenasNumeros = tel.replace(/\D/g, '');
  if(apenasNumeros.length === 11){
    return `(${apenasNumeros.substring(0,2)}) ${apenasNumeros.substring(2,7)}-${apenasNumeros.substring(7)}`;
  }else if(apenasNumeros.length === 10){
    return `(${apenasNumeros.substring(0,2)}) ${apenasNumeros.substring(2,6)}-${apenasNumeros.substring(6)}`;
  }

/* =========================
   BACKUP FUNCTIONS
========================= */
function exportBackup() {
  const db = loadDB();
  const dataStr = JSON.stringify(db, null, 2);
  const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
  const exportFileDefaultName = `backup-btx-${new Date().toISOString().slice(0,10)}.json`;
  
  const linkElement = document.createElement('a');
  linkElement.setAttribute('href', dataUri);
  linkElement.setAttribute('download', exportFileDefaultName);
  linkElement.click();
  toast("Backup exportado");
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (confirm('Restaurar backup? Isso sobrescreverá todos os dados atuais.')) {
          localStorage.setItem(KEY, JSON.stringify(data));
          db = ensureDB();
          toast('Backup restaurado com sucesso!');
          setTimeout(() => location.reload(), 800);
        }
      } catch(err) {
        toast('Erro ao restaurar backup', false);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function clearAll() {
  if (confirm('⚠️ ATENÇÃO: Tem certeza? Isso excluirá TODOS os dados: pacientes, agendamentos, evoluções, receitas e configurações.')) {
    if(confirm('🔄 Confirmar exclusão completa de todos os dados?')){
      localStorage.removeItem(KEY);
      db = ensureDB();
      toast('Todos os dados foram removidos');
      setTimeout(() => location.reload(), 800);
    }
  }
}

/* =========================
   NAVEGAÇÃO DE ABAS
========================= */
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    activeTab = btn.dataset.tab;
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    render();
  });
});

/* =========================
   MODAL FUNCTIONS
========================= */
function openModal(content){
  document.getElementById("modalContent").innerHTML = content;
  document.getElementById("receitaModal").classList.add("show");
}

function closeModal(){
  document.getElementById("receitaModal").classList.remove("show");
  editingReceitaId = null;
}

/* =========================
   RENDER
========================= */
function render(){
  try {
    if(activeTab==="config"){ renderConfig(); }
    else if(activeTab==="agenda"){ renderAgenda(); }
    else if(activeTab==="pacientes"){ renderPacientes(); }
    else if(activeTab==="receitas"){ renderReceitas(); }
    else if(activeTab==="docs"){ renderDocs(); }
  } catch(e){
    console.error("Erro no render:", e);
    toast("Erro ao carregar conteúdo", false);
  }
}
render();

/* =========================
   TAB: CONFIG (COMPLETA)
========================= */
function renderConfig(){
  const p = db.prof;

  side.innerHTML = `
    <div class="card">
      <div class="title">⚙️ Configurações Profissionais</div>
      <div class="hint">Estes dados aparecem em todos os documentos gerados.</div>

      <label>Categoria Profissional</label>
      <select id="profCat">
        <option ${p.categoria==="Misto (CRM/CRO)"?"selected":""}>Misto (CRM/CRO)</option>
        <option ${p.categoria==="Médico (CRM)"?"selected":""}>Médico (CRM)</option>
        <option ${p.categoria==="Dentista (CRO)"?"selected":""}>Dentista (CRO)</option>

function createAutoBackup(){
  const backupData = {
    timestamp: new Date().toISOString(),
    data: db,
    version: "v3"
  };
  
  const backupStr = JSON.stringify(backupData, null, 2);
  const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(backupStr);
  
  const linkElement = document.createElement('a');
  linkElement.setAttribute('href', dataUri);
  linkElement.setAttribute('download', `backup-auto-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.json`);
  linkElement.click();
  toast("Backup automático criado!");
}

function viewBackupHistory(){
  // Implementação simples do histórico
  const backups = [];
  for(let i = 0; i < localStorage.length; i++){
    const key = localStorage.key(i);
    if(key.startsWith("backup_")){
      try {
        const data = JSON.parse(localStorage.getItem(key));
        backups.push({key, timestamp: data.timestamp});
      } catch(e){}
    }
  }
  
  if(backups.length === 0){
    toast("Nenhum backup automático encontrado", false);
    return;
  }
  
  let html = `<div class="title">📋 Histórico de Backups</div>`;
  html += `<div class="list">`;
  
  backups.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).forEach(b => {
    const date = fmtBRDateTime(b.timestamp);
    html += `
      <div class="item">
        <div class="top">
          <div>
            <strong>${date}</strong>
          </div>
          <div>
            <button class="btn secondary" onclick="restoreBackup('${b.key}')">Restaurar</button>
            <button class="btn danger" onclick="deleteBackup('${b.key}')">Excluir</button>
          </div>
        </div>
      </div>
    `;
  });
  
  html += `</div>`;
  openModal(html);
}

function renderMonthCalendar(){
  const d = new Date(monthCursor);
  const year = d.getFullYear();
  const month = d.getMonth();
  const today = toISODate(new Date());

  const first = new Date(year, month, 1);
  const last = new Date(year, month+1, 0);
  const startDow = first.getDay();
  const totalDays = last.getDate();

  const monthName = first.toLocaleDateString("pt-BR", {month:"long", year:"numeric"});
  const dow = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

  // Contar agendamentos por dia
  const countMap = {};
  db.agenda.forEach(a=>{
    const k = toISODate(a.dataISO);
    countMap[k] = (countMap[k]||0)+1;
  });

  let cells = [];
  // Dias do mês anterior
  const prevLast = new Date(year, month, 0).getDate();
  for(let i=0;i<startDow;i++){
    const dayNum = prevLast - (startDow-1-i);
    const iso = toISODate(new Date(year, month-1, dayNum));
    cells.push({label: dayNum, iso, muted:true});
  }
  // Dias do mês atual
  for(let day=1; day<=totalDays; day++){
    const iso = toISODate(new Date(year, month, day));
    const isToday = iso === today;
    cells.push({label: day, iso, muted:false, today: isToday});
  }
  // Dias do próximo mês
  while(cells.length % 7 !== 0){
    const nextDay = cells.length - (startDow + totalDays) + 1;
    const iso = toISODate(new Date(year, month+1, nextDay));
    cells.push({label: nextDay, iso, muted:true});
  }

  return `
    <div class="calWrap">
      <div class="calHead">
        <button class="btn secondary" onclick="calPrev()">◀ Mês Anterior</button>
        <div style="font-weight:1000;text-transform:capitalize; font-size:14px">${escapeHtml(monthName)}</div>
        <button class="btn secondary" onclick="calNext()">Próximo Mês ▶</button>
      </div>

      <div class="calGrid">
        ${dow.map(x=>`<div class="dow">${x}</div>`).join("")}
        ${cells.map(c=>{
          const sel = (c.iso===selectedDayISO) ? "selected" : "";
          const aptN = countMap[c.iso] || 0;
          const todayClass = c.today ? "today" : "";
          return `
            <div class="dayCell ${c.muted?"muted":""} ${sel} ${todayClass}" 
                 onclick="selectDay('${c.iso}')"
                 style="${c.today?'border-color: var(--ok); background: rgba(34,197,94,.1);':''}">
              <div class="dayNum" style="${c.today?'color: var(--ok); font-weight:900;':''}">${c.label}</div>
              ${aptN ? `<span class="badgeApt">${aptN} ${aptN===1?'consulta':'consultas'}</span>` : ''}
              ${c.iso === today ? `<div style="position:absolute; bottom:4px; right:4px; width:6px; height:6px; background:var(--ok); border-radius:50%;"></div>` : ''}
            </div>
          `;
        }).join("")}
      </div>

      <div class="small">
        <span style="display:inline-block; width:10px; height:10px; background:var(--ok); border-radius:50%; margin-right:5px;"></span> Hoje
        <span style="display:inline-block; width:10px; height:10px; border:2px solid var(--accent); border-radius:50%; margin:0 5px 0 15px;"></span> Selecionado
      </div>
    </div>
  `;
}

function addAgenda(){
  const pid = document.getElementById("agPaciente").value;

  if(!hora){ toast("Informe o horário.", false); return; }

function editAgenda(id){
  const agenda = db.agenda.find(a => a.id === id);
  if(!agenda) return;
  
  selectedDayISO = toISODate(agenda.dataISO);
  
  // Preencher formulário
  document.getElementById("agPaciente").value = agenda.pacienteId;
  document.getElementById("agHora").value = agenda.hora || "08:00";
  document.getElementById("agDuracao").value = agenda.duracao || 30;
  document.getElementById("agTipo").value = agenda.tipo || "Retorno";
  document.getElementById("agStatus").value = agenda.status || "agendado";
  document.getElementById("agResumo").value = agenda.resumo || "";
  
  // Alterar botão para edição
  const btn = document.querySelector('[onclick="addAgenda()"]');
  btn.setAttribute("onclick", `updateAgenda('${id}')`);
  btn.innerHTML = "✏️ Atualizar Consulta";
  
  toast("Modo edição ativado. Atualize os dados e clique em 'Atualizar Consulta'.");
}

function updateAgenda(id){
  const index = db.agenda.findIndex(a => a.id === id);
  if(index === -1) return;
  
  const hora = document.getElementById("agHora").value;
  if(!hora){ toast("Informe o horário.", false); return; }
  
  db.agenda[index] = {
    ...db.agenda[index],
    pacienteId: document.getElementById("agPaciente").value,
    dataISO: new Date(selectedDayISO + "T" + hora + ":00").toISOString(),
    hora,
    duracao: parseInt(document.getElementById("agDuracao").value) || 30,
    tipo: document.getElementById("agTipo").value,
    status: document.getElementById("agStatus").value,
    resumo: document.getElementById("agResumo").value.trim(),
    atualizadoEm: new Date().toISOString()
  };
  
  if(saveDB(db)){
    toast("Consulta atualizada!");
    
    // Restaurar botão original
    const btn = document.querySelector(`[onclick="updateAgenda('${id}')"]`);
    btn.setAttribute("onclick", "addAgenda()");
    btn.innerHTML = "✅ Agendar Consulta";
    
    clearAgendaForm();
    renderAgenda();
  }
}

function delAgenda(id){
  if(!confirm("Tem certeza que deseja excluir este agendamento?")) return;
  
  db.agenda = db.agenda.filter(a=>a.id!==id);
  if(saveDB(db)){
    toast("Agendamento excluído.");
    renderAgenda();
  }
}

function markAsRealized(id){
  const index = db.agenda.findIndex(a => a.id === id);
  if(index === -1) return;
  
  db.agenda[index].status = "realizado";
  db.agenda[index].realizadoEm = new Date().toISOString();

function exportAgendaToPDF(){
  // Implementação similar à print, mas gerando PDF
  toast("Gerando PDF da agenda...");
  setTimeout(() => {
    const apts = getAgendaByDay(selectedDayISO);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    doc.setFontSize(16);
    doc.text(`Agenda do Dia: ${fmtBRDate(selectedDayISO)}`, 20, 20);
    
    doc.setFontSize(10);
    let y = 40;
    apts.forEach((a, idx) => {
      const p = getPatient(a.pacienteId);
      if(y > 280){
        doc.addPage();
        y = 20;
      }
      
      doc.setFont("helvetica", "bold");
      doc.text(`${a.hora || '--:--'} - ${escapeHtml(p ? p.nome : 'Paciente removido')}`, 20, y);
      y += 7;
      
      doc.setFont("helvetica", "normal");
      doc.text(`Tipo: ${a.tipo} | Duração: ${a.duracao || 30} min | Status: ${a.status || 'agendado'}`, 20, y);
      y += 7;
      
      if(a.resumo){
        const lines = doc.splitTextToSize(`Obs: ${a.resumo}`, 170);
        doc.text(lines, 20, y);
        y += lines.length * 5 + 5;
      } else {
        y += 5;
      }
      
      if(idx < apts.length - 1){
        doc.setDrawColor(200);
        doc.line(20, y, 190, y);
        y += 10;
      }
    });
    
    if(apts.length === 0){
      doc.text("Nenhuma consulta agendada para este dia.", 20, y);
    }
    
    doc.setFontSize(8);
    doc.text(`Gerado em ${fmtBRDateTime(new Date())} • BTX Prontuário`, 105, 290, {align: "center"});
    
    const pdfURL = doc.output('bloburl');
    const link = document.createElement('a');
    link.href = pdfURL;
    link.download = `agenda-${selectedDayISO}.pdf`;
    link.click();
    
    toast("PDF da agenda gerado com sucesso!");
  }, 500);
}

function sendDayReminders(){
  const apts = getAgendaByDay(selectedDayISO);
  if(apts.length === 0){
    toast("Nenhuma consulta para enviar lembretes", false);
    return;
  }
  
  let message = `📅 Lembretes para ${fmtBRDate(selectedDayISO)}:\n\n`;
  
  apts.forEach((a, idx) => {
    const p = getPatient(a.pacienteId);
    message += `${idx+1}. ${a.hora} - ${p ? p.nome : 'Paciente'}`;
    if(p?.telefone){
      message += ` (${formatTelefone(p.telefone)})`;
    }
    message += `\n   Tipo: ${a.tipo}\n\n`;
  });
  
  message += `\nTotal: ${apts.length} consulta(s)`;
  
  // Copiar para área de transferência
  navigator.clipboard.writeText(message).then(() => {
    toast("Lembretes copiados para a área de transferência!");
    
    // Oferecer para enviar por WhatsApp
    if(confirm("Deseja enviar os lembretes por WhatsApp?")){
      const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
      window.open(whatsappUrl, '_blank');
    }
  });
}

function updatePaciente(id){
  const index = db.pacientes.findIndex(p => p.id === id);
  if(index === -1) return;
  
  const nome = document.getElementById("editNome").value.trim();

  if(!nome){ toast("Nome é obrigatório.", false); return; }
  if(!telefone){ toast("Telefone é obrigatório.", false); return; }
  
  db.pacientes[index] = {
    ...db.pacientes[index],
    nome,
    nasc: document.getElementById("editNasc").value || null,
    sexo: document.getElementById("editSexo").value || null,
    cpf: document.getElementById("editCpf").value.trim() || null,
    rg: document.getElementById("editRg").value.trim() || null,

  };

function delPaciente(id){
  const paciente = getPatient(id);
  if(!paciente) return;
  
  if(confirm(`Excluir paciente "${paciente.nome}"?\n\n⚠️ Esta ação também excluirá todas as evoluções, receitas e agendamentos relacionados.`)){
    if(confirm(`Confirma exclusão permanente de "${paciente.nome}"?\n\nEsta ação não pode ser desfeita.`)){
      // Remover paciente
      db.pacientes = db.pacientes.filter(p=>p.id!==id);
      // Remover evoluções
      db.evolucoes = db.evolucoes.filter(e=>e.pacienteId!==id);
      // Remover receitas
      db.receitas = db.receitas.filter(r=>r.pacienteId!==id);
      // Remover agendamentos
      db.agenda = db.agenda.filter(a=>a.pacienteId!==id);
      
      if(saveDB(db)){
        if(selectedPatientId === id){
          selectedPatientId = db.pacientes.length ? db.pacientes[0].id : null;
        }
        toast("Paciente excluído permanentemente.");
        renderPacientes();
      }
    }
  }
}

function addEvolucao(pacienteId){
  const data = document.getElementById("evoData").value;
  const soapS = document.getElementById("soapS").value.trim();
  const soapO = document.getElementById("soapO").value.trim();
  const soapA = document.getElementById("soapA").value.trim();
  const soapP = document.getElementById("soapP").value.trim();
  const conduta = document.getElementById("evConduta").value.trim();
  
  if(!data){ toast("Data é obrigatória.", false); return; }
  if(!soapS || !soapO || !soapA || !soapP || !conduta){
    toast("Preencha todos os campos obrigatórios do SOAP e Conduta.", false);
    return;
  }
  
  const evolucao = {

    pacienteId,
    dataISO: new Date(data + "T12:00:00").toISOString(),

function editEvolucao(id){
  const e = db.evolucoes.find(ev=>ev.id===id);
  if(!e) return;
  
  // Preencher formulário
  document.getElementById("evoData").value = toISODate(e.dataISO);
  document.getElementById("evoTipo").value = e.tipoAtend;
  document.getElementById("soapS").value = e.soapS || "";
  document.getElementById("soapO").value = e.soapO || "";
  document.getElementById("soapA").value = e.soapA || "";
  document.getElementById("soapP").value = e.soapP || "";
  document.getElementById("evOdonto").value = e.odonto || "";
  document.getElementById("evExames").value = e.exames || "";
  document.getElementById("evConduta").value = e.conduta || "";
  document.getElementById("evAnotacoes").value = e.anotacoes || "";
  
  // Alterar botão
  const btn = document.querySelector(`[onclick="addEvolucao('${e.pacienteId}')"]`);
  btn.setAttribute("onclick", `updateEvolucao('${id}')`);
  btn.innerHTML = "✏️ Atualizar Evolução";
  
  toast("Modo edição ativado. Atualize os dados e clique em 'Atualizar Evolução'.");
}

function updateEvolucao(id){
  const index = db.evolucoes.findIndex(ev=>ev.id===id);
  if(index === -1) return;
  
  const data = document.getElementById("evoData").value;
  const soapS = document.getElementById("soapS").value.trim();
  const soapO = document.getElementById("soapO").value.trim();
  const soapA = document.getElementById("soapA").value.trim();
  const soapP = document.getElementById("soapP").value.trim();
  const conduta = document.getElementById("evConduta").value.trim();
  
  if(!data){ toast("Data é obrigatória.", false); return; }
  if(!soapS || !soapO || !soapA || !soapP || !conduta){
    toast("Preencha todos os campos obrigatórios.", false);
    return;
  }
  
  db.evolucoes[index] = {
    ...db.evolucoes[index],
    dataISO: new Date(data + "T12:00:00").toISOString(),
    tipoAtend: document.getElementById("evoTipo").value,
    soapS,
    soapO,
    soapA,
    soapP,
    odonto: document.getElementById("evOdonto").value.trim() || null,
    exames: document.getElementById("evExames").value.trim() || null,
    conduta,
    anotacoes: document.getElementById("evAnotacoes").value.trim() || null,
    atualizadoEm: new Date().toISOString()
  };
  
  if(saveDB(db)){
    toast("Evolução atualizada!");
    
    // Restaurar botão
    const btn = document.querySelector(`[onclick="updateEvolucao('${id}')"]`);
    btn.setAttribute("onclick", `addEvolucao('${db.evolucoes[index].pacienteId}')`);
    btn.innerHTML = "✅ Salvar Evolução";
    
    clearEvolucaoForm();
    renderPacientes();
  }
}

function delEvolucao(id){
  if(!confirm("Excluir esta evolução?\n\nEsta ação não pode ser desfeita.")) return;
  
  db.evolucoes = db.evolucoes.filter(e=>e.id!==id);
  if(saveDB(db)){
    toast("Evolução excluída.");
    renderPacientes();
  }
}

function gerarPDFEvolucao(id){

function addMedicamentoLine(){
  medicamentosCount++;
  renderMedicamentosList();
  updateReceitaPreview();
}

function removeMedicamentoLine(index){
  if(medicamentosCount > 1){
    const line = document.getElementById(`medLine${index}`);
    if(line) line.remove();
    
    // Reindexar as linhas restantes
    const newLines = [];
    for(let i = 0; i < medicamentosCount; i++){
      if(i !== index){
        newLines.push(i);
      }
    }
    
    medicamentosCount = newLines.length;
    renderMedicamentosList();
    updateReceitaPreview();
  }
}

function updateMedApresentacao(index){
  const select = document.getElementById(`medNome${index}`);
  const customInput = document.getElementById(`medCustom${index}`);
  const apresInput = document.getElementById(`medApres${index}`);
  
  if(select.value === '_custom'){
    customInput.style.display = 'block';
    apresInput.value = '';
  } else {
    customInput.style.display = 'none';
    customInput.value = '';
    
    // Encontrar medicamento na lista
    const medicamento = db.medicamentos.find(m => m.nome === select.value);
    if(medicamento && medicamento.apresentacao){
      apresInput.value = medicamento.apresentacao;
    }
  }
  updateReceitaPreview();
}

function gerarNovaReceita(){
  const pacienteId = selectedPatientId;
  if(!pacienteId) {
    toast("Selecione um paciente", false);
    return;
  }
  
  const paciente = getPatient(pacienteId);
  if(!paciente) return;
  
  // Coletar medicamentos
  let medicamentos = [];
  let hasErrors = false;
  
  for(let i = 0; i < medicamentosCount; i++){
    const nomeSelect = document.getElementById(`medNome${i}`);
    const customInput = document.getElementById(`medCustom${i}`);
    const qtdInput = document.getElementById(`medQtd${i}`);
    const apresInput = document.getElementById(`medApres${i}`);
    
    if(!nomeSelect || !qtdInput) continue;
    
    let nome = "";
    if(nomeSelect.value === '_custom'){
      nome = customInput?.value.trim() || "";
    } else {
      nome = nomeSelect.value;
    }
    
    const qtd = qtdInput.value.trim();
    const apres = apresInput?.value.trim() || "";
    
    if(nome && qtd){
      medicamentos.push({
        nome: nome,
        quantidade: qtd,
        apresentacao: apres || "Não especificado",
        posologia: "Conforme orientação médica"
      });
      
      // Adicionar à lista de medicamentos se for custom
      if(nomeSelect.value === '_custom' && nome && !db.medicamentos.some(m => m.nome === nome)){
        db.medicamentos.push({
          nome: nome,
          apresentacao: apres || ""
        });
      }
    } else if(nome || qtd){
      hasErrors = true;
    }
  }
  
  if(medicamentos.length === 0){
    toast("Adicione pelo menos um medicamento", false);
    return;
  }
  
  if(hasErrors){
    if(!confirm("Alguns medicamentos estão incompletos. Deseja continuar assim mesmo?")){
      return;
    }
  }
  
  const receita = {
    id: uid(),
    pacienteId,
    dataISO: new Date(document.getElementById("recData").value + "T12:00:00").toISOString(),
    medicoId: db.prof.nome || "Médico",
    itens: medicamentos,
    observacoes: document.getElementById("recObs")?.value.trim() || "",
    validade: parseInt(document.getElementById("recValidade")?.value) || 30,
    criadoEm: new Date().toISOString()
  };
  
  db.receitas.push(receita);
  if(saveDB(db)){
    toast("Receita gerada com sucesso!");
    
    // Resetar formulário
    medicamentosCount = 1;
    document.getElementById("recObs").value = "";
    renderMedicamentosList();
    updateReceitaPreview();
    
    // Mostrar a receita gerada
    viewReceita(receita.id);
  }
}

function deleteReceita(id){

  db.receitas = db.receitas.filter(r => r.id !== id);

    renderReceitas();
  }
}

function generatePDF(){
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const prof = db.prof;
    const docType = document.getElementById("docType").value;
    const patientId = document.getElementById("docPatient").value;
    const patient = patientId ? getPatient(patientId) : null;
    
    // Configurações
    const margin = 20;
    let y = margin;
    const pageWidth = doc.internal.pageSize.width;
    const pageHeight = doc.internal.pageSize.height;
    
    // Cabeçalho padrão
    doc.setFontSize(16);
    doc.setFont("helvetica", "bold");
    doc.text("BTX • Prontuário + Agenda", pageWidth/2, y, {align: "center"});
    y += 8;
    
    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.text(`${prof.nome || 'Profissional'} • ${prof.categoria || ''} • ${prof.registro || ''}`, pageWidth/2, y, {align: "center"});
    y += 6;
    if(prof.endereco || prof.cidadeUF){
      doc.text(`${prof.endereco || ''} ${prof.endereco && prof.cidadeUF ? '•' : ''} ${prof.cidadeUF || ''}`, pageWidth/2, y, {align: "center"});
      y += 6;
    }
    if(prof.contato){
      doc.text(`${prof.contato || ''} ${prof.email ? '• ' + prof.email : ''}`, pageWidth/2, y, {align: "center"});
      y += 6;
    }
    
    doc.setDrawColor(150);
    doc.line(margin, y, pageWidth - margin, y);
    y += 12;
    
    // Conteúdo específico por tipo
    if(docType === "evolucao" && patient){
      const evolucaoId = document.getElementById("docEvolucao")?.value;
      const ev = db.evolucoes.find(e => e.id === evolucaoId);
      
      if(ev){
        doc.setFontSize(14);
        doc.setFont("helvetica", "bold");
        doc.text("EVOLUÇÃO MÉDICA", margin, y);
        y += 10;
        
        // Dados do paciente
        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        doc.text("PACIENTE:", margin, y);
        doc.setFont("helvetica", "normal");
        doc.text(`${patient.nome} ${patient.nasc ? `• ${calcularIdade(patient.nasc)} anos` : ''}`, margin + 25, y);
        y += 6;
        
        doc.setFont("helvetica", "bold");
        doc.text("DATA:", margin, y);
        doc.setFont("helvetica", "normal");
        doc.text(fmtBRDate(ev.dataISO), margin + 25, y);
        
        doc.setFont("helvetica", "bold");
        doc.text("TIPO:", pageWidth/2, y);
        doc.setFont("helvetica", "normal");
        doc.text(ev.tipoAtend, pageWidth/2 + 25, y);
        y += 10;
        
        // SOAP
        const sections = [
          {title: "S - SUBJETIVO", content: ev.soapS},
          {title: "O - OBJETIVO", content: ev.soapO},
          {title: "A - AVALIAÇÃO", content: ev.soapA},
          {title: "P - PLANO", content: ev.soapP}
        ];
        
        sections.forEach(section => {
          doc.setFont("helvetica", "bold");
          doc.text(`${section.title}:`, margin, y);
          y += 6;
          
          doc.setFont("helvetica", "normal");
          const lines = doc.splitTextToSize(section.content || "Não informado", pageWidth - 2*margin);
          doc.text(lines, margin, y);
          y += lines.length * 5 + 8;
          
          if(y > pageHeight - 40){
            doc.addPage();
            y = margin;
          }
        });
        
        // Informações adicionais
        if(ev.exames){
          doc.setFont("helvetica", "bold");
          doc.text("EXAMES SOLICITADOS:", margin, y);
          y += 6;
          
          doc.setFont("helvetica", "normal");
          const lines = doc.splitTextToSize(ev.exames, pageWidth - 2*margin);
          doc.text(lines, margin, y);
          y += lines.length * 5 + 8;
        }
        
        if(ev.conduta){
          doc.setFont("helvetica", "bold");
          doc.text("CONDUTA / PRESCRIÇÃO:", margin, y);
          y += 6;
          
          doc.setFont("helvetica", "normal");
          const lines = doc.splitTextToSize(ev.conduta, pageWidth - 2*margin);
          doc.text(lines, margin, y);
          y += lines.length * 5 + 8;
        }
        
        if(ev.anotacoes){
          doc.setFont("helvetica", "bold");
          doc.text("ANOTAÇÕES ADICIONAIS:", margin, y);
          y += 6;
          
          doc.setFont("helvetica", "normal");
          const lines = doc.splitTextToSize(ev.anotacoes, pageWidth - 2*margin);
          doc.text(lines, margin, y);
          y += lines.length * 5 + 8;
        }
      }
    }
    else if(docType === "prontuario" && patient){
      // Similar à evolução, mas com histórico completo
      doc.setFontSize(14);
      doc.setFont("helvetica", "bold");
      doc.text("PRONTUÁRIO MÉDICO COMPLETO", margin, y);
      y += 10;
      
      // Dados do paciente
      doc.setFontSize(10);
      doc.text(`Paciente: ${patient.nome}`, margin, y);
      y += 6;
      if(patient.nasc){
        doc.text(`Nascimento: ${fmtBRDate(patient.nasc)} (${calcularIdade(patient.nasc)} anos)`, margin, y);
        y += 6;
      }
      if(patient.telefone){
        doc.text(`Telefone: ${patient.telefone}`, margin, y);
        y += 6;
      }
      if(patient.email){
        doc.text(`E-mail: ${patient.email}`, margin, y);
        y += 6;
      }
      if(patient.endereco){
        doc.text(`Endereço: ${patient.endereco}`, margin, y);
        y += 6;
      }
      if(patient.obs){
        doc.text(`Observações: ${patient.obs}`, margin, y);
        y += 6;
      }
      
      y += 10;
      
      // Histórico de evoluções
      const evs = getEvolucoes(patient.id);
      if(evs.length > 0){
        doc.setFont("helvetica", "bold");
        doc.text("HISTÓRICO DE EVOLUÇÕES:", margin, y);
        y += 10;
        
        evs.forEach((ev, idx) => {
          doc.setFont("helvetica", "bold");
          doc.text(`Evolução ${idx+1} - ${fmtBRDate(ev.dataISO)} • ${ev.tipoAtend}`, margin, y);
          y += 8;
          
          doc.setFont("helvetica", "normal");
          const resumo = `S: ${ev.soapS?.substring(0, 100) || ''}... O: ${ev.soapO?.substring(0, 100) || ''}...`;
          const lines = doc.splitTextToSize(resumo, pageWidth - 2*margin);
          doc.text(lines, margin, y);
          y += lines.length * 5 + 8;
          
          if(y > pageHeight - 40){
            doc.addPage();
            y = margin;
          }
        });
      }
    }
    else if(docType === "agenda"){
      const agendaDate = document.getElementById("docAgendaDate")?.value || selectedDayISO;
      const apts = getAgendaByDay(agendaDate);
      
      doc.setFontSize(14);
      doc.setFont("helvetica", "bold");
      doc.text("AGENDA PROFISSIONAL", margin, y);
      y += 8;
      
      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.text(`Data: ${fmtBRDate(agendaDate)}`, margin, y);
      y += 10;
      
      if(apts.length > 0){
        apts.forEach((apt, idx) => {
          const p = getPatient(apt.pacienteId);
          
          doc.setFont("helvetica", "bold");
          doc.text(`${apt.hora || '--:--'} - ${p ? p.nome : 'Paciente'}`, margin, y);
          y += 6;
          
          doc.setFont("helvetica", "normal");
          const info = `${apt.tipo} • ${apt.duracao || 30} min • ${apt.status || 'agendado'}`;
          doc.text(info, margin + 5, y);
          y += 6;
          
          if(apt.resumo){
            const lines = doc.splitTextToSize(apt.resumo, pageWidth - 2*margin - 10);
            doc.text(lines, margin + 10, y);
            y += lines.length * 5 + 4;
          }
          
          y += 8;
          
          if(y > pageHeight - 40){
            doc.addPage();
            y = margin;
          }
        });
      } else {
        doc.text("Nenhuma consulta agendada para este dia.", margin, y);
      }
    }
    else if(docType === "receita" && patient){
      const receitaId = document.getElementById("docReceita")?.value;
      const receita = db.receitas.find(r => r.id === receitaId);
      
      if(receita){
        // Mesmo conteúdo da função printReceita, mas formatado para jsPDF
        // Implementação similar à viewReceita, mas gerando PDF
      }
    }
    else if(docType === "atestado" && patient){
      const dias = document.getElementById("atestadoDias")?.value || 5;
      const motivo = document.getElementById("atestadoMotivo")?.value || "Doença";
      const obs = document.getElementById("atestadoObs")?.value || "";
      const cid = document.getElementById("atestadoCID")?.value || "";
      
      doc.setFontSize(14);
      doc.setFont("helvetica", "bold");
      doc.text("ATESTADO MÉDICO", pageWidth/2, y, {align: "center"});
      y += 15;
      
      doc.setFontSize(11);
      doc.setFont("helvetica", "normal");
      
      const textoAtestado = `
        Atesto que ${patient.nome}, ${patient.nasc ? calcularIdade(patient.nasc) + ' anos,' : ''} 
        portador(a) do ${patient.cpf ? 'CPF ' + patient.cpf + ',' : ''} 
        necessita de afastamento de suas atividades por ${dias} ${dias == 1 ? 'dia' : 'dias'}, 
        a partir de ${fmtBRDate(new Date())}, motivo: ${motivo}.
        ${obs ? '\n\n' + obs : ''}
      `;
      
      const lines = doc.splitTextToSize(textoAtestado, pageWidth - 2*margin);
      doc.text(lines, margin, y);
      y += lines.length * 5 + 15;
      
      if(cid){
        doc.text(`CID: ${cid}`, margin, y);
        y += 10;
      }
      
      doc.text(`Local e data: ${prof.cidadeUF || ''}, ${fmtBRDate(new Date())}`, margin, y);
      y += 20;
      
      // Assinatura
      doc.setFont("helvetica", "bold");
      doc.text("________________________________________", pageWidth/2, y, {align: "center"});
      y += 8;
      doc.text(prof.nome || "Médico", pageWidth/2, y, {align: "center"});
      y += 6;
      doc.setFontSize(9);
      doc.text(prof.registro || "", pageWidth/2, y, {align: "center"});
    }
    
    // Rodapé
    doc.setFontSize(8);
    doc.setFont("helvetica", "italic");
    const footerText = `Gerado em ${fmtBRDateTime(new Date())} • BTX Prontuário + Agenda • Página ${doc.internal.getNumberOfPages()}`;
    doc.text(footerText, pageWidth/2, pageHeight - 10, {align: "center"});
    
    // Gerar URL para preview
    pdfURL = doc.output('bloburl');
    
    // Atualizar preview
    const preview = document.getElementById("pdfPreview");
    preview.innerHTML = `<iframe src="${pdfURL}"></iframe>`;
    
    // Habilitar botões
    document.querySelector('[onclick="downloadPDF()"]').disabled = false;
    document.querySelector('[onclick="previewPDF()"]').disabled = false;
    
    toast("PDF gerado com sucesso!");
  } catch(error){
    console.error("Erro ao gerar PDF:", error);
    toast("Erro ao gerar PDF", false);
  }
}

function downloadPDF(){
  if(!pdfURL) return;
  
  const link = document.createElement('a');
  link.href = pdfURL;
  const docType = document.getElementById("docType").value;
  const patientId = document.getElementById("docPatient").value;
  const patient = patientId ? getPatient(patientId) : null;
  
  let filename = `btx-${docType}-${new Date().toISOString().slice(0,10)}`;
  if(patient){
    filename = `btx-${docType}-${patient.nome.replace(/\s+/g, '-').toLowerCase()}-${new Date().toISOString().slice(0,10)}`;
  }
  
  link.download = `${filename}.pdf`;
  link.click();
}

function previewPDF(){
  if(!pdfURL) return;
  
  const previewWindow = window.open(pdfURL, '_blank');
  if(previewWindow){
    previewWindow.focus();
  }
}

function clearPDF(){
  pdfURL = null;
  const preview = document.getElementById("pdfPreview");
  preview.innerHTML = `
    <div style="display:grid; place-items:center; height:100%; color:var(--muted);">
      <div style="text-align:center; padding:40px;">
        <div style="font-size:48px; margin-bottom:20px;">📄</div>
        <div>Nenhum PDF gerado ainda.</div>
        <div class="small">Selecione as opções e clique em "Gerar PDF".</div>
      </div>
    </div>
  `;
  
  document.querySelector('[onclick="downloadPDF()"]').disabled = true;
  document.querySelector('[onclick="previewPDF()"]').disabled = true;
  
  toast("Preview limpo");
}

/* =========================
   INICIALIZAÇÃO
========================= */
window.onload = function() {
  try {
    ensureDB();
    render();
    
    // Verificar se é primeira execução
    const firstRun = localStorage.getItem("btx_first_run");
    if(!firstRun){
      setTimeout(() => {
        toast("Bem-vindo ao BTX Prontuário! Comece configurando seus dados na aba Config.", true);
        localStorage.setItem("btx_first_run", "true");
      }, 1000);
    }
    
    // Salvar backup automático periodicamente
    setInterval(() => {
      const backupKey = `backup_auto_${new Date().toISOString().slice(0,10)}`;
      const backupData = {
        timestamp: new Date().toISOString(),
        data: db,
        version: "v3"
      };
      localStorage.setItem(backupKey, JSON.stringify(backupData));
    }, 24 * 60 * 60 * 1000); // 24 horas
  } catch(e){
    console.error("Erro na inicialização:", e);
    toast("Erro ao carregar sistema", false);
  }
};
